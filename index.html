<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초등 맞춤법 퀴즈왕</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        /* 1. 모바일 친화적 디자인 스타일 */
        body {
            font-family: 'Jua', sans-serif;
            background-color: #FFEB99; /* 따뜻한 노란색 */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            background-color: white;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #FF8C00;
            margin-bottom: 10px;
        }

        .progress-bar {
            background-color: #eee;
            border-radius: 10px;
            height: 10px;
            width: 100%;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            background-color: #4CAF50;
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        .quiz-card {
            margin-top: 20px;
        }

        .question-box {
            font-size: 1.4rem;
            margin-bottom: 30px;
            background-color: #E0F7FA;
            padding: 20px;
            border-radius: 15px;
            line-height: 1.6;
        }

        /* 빈칸 스타일 */
        .blank {
            display: inline-block;
            width: 80px;
            border-bottom: 3px solid #333;
            margin: 0 5px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background-color: #fff;
            border: 3px solid #FF8C00;
            color: #FF8C00;
            padding: 15px;
            font-size: 1.2rem;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Jua', sans-serif;
        }

        .btn:hover, .btn:active {
            background-color: #FF8C00;
            color: white;
            transform: scale(0.98);
        }

        /* 정답/오답 피드백 스타일 */
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none; /* 기본 숨김 */
        }
        .correct-box { background-color: #D4EDDA; color: #155724; }
        .wrong-box { background-color: #F8D7DA; color: #721C24; }

        .next-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            width: 100%;
            margin-top: 15px;
            display: none; /* 피드백 후 등장 */
        }

        .result-screen {
            display: none;
        }
        
        .score-big {
            font-size: 3rem;
            color: #FF8C00;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="quiz-screen">
            <h1>📝 맞춤법 퀴즈왕</h1>
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
            
            <div class="quiz-card">
                <div class="question-box" id="question-text">
                    </div>

                <div class="options" id="options-container">
                    </div>
            </div>

            <div id="feedback-area" class="feedback"></div>
            <button class="btn next-btn" id="next-btn" onclick="nextQuestion()">다음 문제 👉</button>
        </div>

        <div id="result-screen" class="result-screen">
            <h1>🎉 퀴즈 완료!</h1>
            <p>오늘의 성적은?</p>
            <div class="score-big" id="final-score">0점</div>
            <p id="result-message"></p>
            <button class="btn" onclick="location.reload()">다시 도전하기</button>
        </div>
    </div>

    <script>
        // 1. 데이터 (샘플 5개, 실제론 300개를 넣으면 됩니다)
        const allQuestions = [
  { "q": "감기가 빨리 ____ 좋겠어.", "opts": ["나았으면", "낳았으면"], "a": "나았으면", "desc": "병이 고쳐지는 것은 '낫다'예요. '낳다'는 아기를 낳을 때 써요." },
  { "q": "숙제를 하지 ____ 선생님께 혼났어요.", "opts": ["안아서", "않아서"], "a": "않아서", "desc": "'~지 않다'처럼 뒤에 올 때는 '않'을 써요. '안'은 '안 해'처럼 앞에 써요." },
  { "q": "오늘은 며칠, 무슨 ____인가요?", "opts": ["요일", "요일"], "a": "요일", "desc": "날짜를 셀 때는 항상 '며칠'이라고 써요. '몇일'이라는 말은 없답니다." },
  { "q": "엄마가 맛있는 김치____를 끓여 주셨다.", "opts": ["찌개", "찌게"], "a": "찌개", "desc": "보글보글 끓이는 음식은 '찌개'가 맞아요. '개'를 기억하세요!" },
  { "q": "동생이 장난감을 ____ 부러뜨렸어요.", "opts": ["금세", "금새"], "a": "금세", "desc": "'금세'는 '금방'의 줄임말이라서 '에'를 써요." },
  { "q": "친구와 운동장에서 ____ 놀았어요.", "opts": ["신나게", "신라게"], "a": "신나게", "desc": "소리는 [신나게]로 나지만, 쓸 때는 '신나게'라고 적어야 해요." },
  { "q": "선생님이 우리에게 수학을 ____ 주셨다.", "opts": ["가르쳐", "가리켜"], "a": "가르쳐", "desc": "지식을 배우는 것은 '가르치다'예요. '가리키다'는 손가락으로 방향을 알릴 때 써요." },
  { "q": "나는 커서 훌륭한 사람이 ____.", "opts": ["될 거야", "됄 거야"], "a": "될 거야", "desc": "'되다' 뒤에 'ㄹ' 받침이 올 때는 '될'이라고 적어요." },
  { "q": "어제 먹은 떡볶이가 참 ____.", "opts": ["매웠어", "메웠어"], "a": "매웠어", "desc": "맛이 맵다고 할 때는 '아이(ㅐ)'를 써서 '맵다', '매웠어'라고 해요." },
  { "q": "할머니, ____ 건강하세요.", "opts": ["오랫동안", "오랜동안"], "a": "오랫동안", "desc": "긴 시간 동안을 말할 때는 사이시옷(ㅅ)을 넣어 '오랫동안'이라고 해요." },
  { "q": "밥을 먹고 나서는 ____를 해야 해.", "opts": ["설거지", "설겆이"], "a": "설거지", "desc": "그릇을 씻는 일은 소리 나는 대로 '설거지'라고 적는 게 맞아요." },
  { "q": "비가 와서 옷이 다 ____.", "opts": ["젖었어", "저졌어"], "a": "젖었어", "desc": "물이 묻는 것은 '젖다'예요. 받침 'ㅈ'을 꼭 챙겨주세요." },
  { "q": "나는 내 동생이랑 성격이 ____.", "opts": ["틀려", "달라"], "a": "달라", "desc": "서로 같지 않을 때는 '다르다'를 써요. '틀리다'는 정답이 아닐 때 써요." },
  { "q": "길을 건널 때는 ____ 건너야 해요.", "opts": ["반듯이", "반드시"], "a": "반드시", "desc": "'꼭'이라는 뜻일 때는 '반드시'라고 써요. '반듯이'는 물건이 삐뚤어지지 않은 모습이에요." },
  { "q": "급식 당번이 숟가락과 ____을 나눠줬다.", "opts": ["젓가락", "젇가락"], "a": "젓가락", "desc": "숟가락 짝꿍은 '젓가락'이에요. 받침 'ㅅ'을 기억하세요." },
  { "q": "친구가 나를 ____ 쳐다봤다.", "opts": ["빤히", "빤이"], "a": "빤히", "desc": "'하다'를 붙일 수 있는 말 뒤에는 보통 '히'를 써요. '빤히'가 맞아요." },
  { "q": "학교 수업이 끝나고 집에 ____ 갈게.", "opts": ["이따가", "있다가"], "a": "이따가", "desc": "시간이 조금 지나고 나중을 말할 때는 '이따가'라고 해요." },
  { "q": "이 문제는 너무 어려워서 ____ 풀지?", "opts": ["어떻게", "어떡해"], "a": "어떻게", "desc": "방법을 물어볼 때는 '어떻게'라고 해요. '어떡해'는 '어떻게 해'의 줄임말이라 문장 끝에 주로 써요." },
  { "q": "____ 일이니? 얼굴이 안 좋아 보여.", "opts": ["무슨", "무슴"], "a": "무슨", "desc": "어떤 일인지 물어볼 때는 받침 'ㄴ'을 써서 '무슨'이라고 해요." },
  { "q": "강아지가 꼬리를 살랑살랑 ____.", "opts": ["흔든다", "흔듬다"], "a": "흔든다", "desc": "움직이게 하는 것은 '흔들다'이고, 문장에서는 '흔든다'로 써요." },
  { "q": "교실 문을 꽉 ____ 주세요.", "opts": ["잠가", "잠궈"], "a": "잠가", "desc": "'잠그다'는 '아'와 만나면 '잠가'가 돼요. '잠궈'는 틀린 말이에요." },
  { "q": "우리 집은 학교에서 ____ 않아요.", "opts": ["멀지", "머지"], "a": "멀지", "desc": "거리가 멀다는 뜻이므로 받침 'ㄹ'이 있는 '멀지'가 맞아요." },
  { "q": "정답을 맞힌 친구는 손을 ____.", "opts": ["드세요", "드새요"], "a": "드세요", "desc": "존댓말을 만들 때는 '으세요'나 '세요'를 붙여요." },
  { "q": "엄마가 끓여준 ____이 제일 맛있어.", "opts": ["육개장", "육계장"], "a": "육개장", "desc": "소고기를 넣어 끓인 탕은 '육개장'이에요. 닭고기(계)가 들어가는 게 아니랍니다." },
  { "q": "운동화 끈을 꽉 ____.", "opts": ["매다", "메다"], "a": "매다", "desc": "끈을 묶는 것은 '매다'예요. 가방을 어깨에 걸칠 때가 '메다'예요." },
  { "q": "저기 보이는 산 ____에 우리 할머니 댁이 있어.", "opts": ["너머", "넘어"], "a": "너머", "desc": "산 뒤쪽 공간을 말할 때는 '너머'라고 해요. '넘어'는 동작으로 넘어갈 때 써요." },
  { "q": "오늘은 ____ 기분이 좋은 날이야.", "opts": ["왠지", "웬지"], "a": "왠지", "desc": "'왜인지'의 줄임말은 '왠지' 하나뿐이에요. 나머지는 다 '웬'을 써요." },
  { "q": "복도에서 뛰면 ____.", "opts": ["안 돼", "안 되"], "a": "안 돼", "desc": "문장을 끝낼 때는 '돼'를 써요. 헷갈리면 '해'를 넣어보세요. 말이 되면 '돼'예요." },
  { "q": "친구에게 생일 선물을 ____.", "opts": ["부쳤다", "붙였다"], "a": "부쳤다", "desc": "편지나 물건을 멀리 보내는 것은 '부치다'예요. 풀로 딱 붙이는 게 '붙이다'예요." },
  { "q": "숲속에서 맑은 공기를 ____.", "opts": ["마시다", "마치다"], "a": "마시다", "desc": "공기나 물을 들이키는 것은 '마시다'입니다." },
  { "q": "내일 소풍 간다니 정말 ____.", "opts": ["설렌다", "설레인다"], "a": "설렌다", "desc": "마음이 두근거리는 것은 '설레다'가 기본형이라 '설렌다'가 맞아요." },
  { "q": "하늘을 날아다니는 ____를 보았니?", "opts": ["연", "년"], "a": "연", "desc": "줄에 매달아 날리는 장난감은 '연'이라고 해요." },
  { "q": "이 옷은 나에게 꼭 ____.", "opts": ["알맞은", "알맞는"], "a": "알맞은", "desc": "형용사는 뒤에 '은'을 붙여요. 작다->작은, 알맞다->알맞은." },
  { "q": "선생님 말씀을 ____ 들어야 해.", "opts": ["곰곰이", "곰곰히"], "a": "곰곰이", "desc": "깊이 생각하는 모양은 '곰곰이'라고 써요. 이건 외워두면 좋아요!" },
  { "q": "우리는 서로 돕는 ____ 사이야.", "opts": ["가까운", "가까은"], "a": "가까운", "desc": "'가깝다'는 뒤에 말이 오면 'ㅂ'이 '우'로 변해서 '가까운'이 돼요." },
  { "q": "약속 시간을 잘 ____ 해요.", "opts": ["지켜야", "직혀야"], "a": "지켜야", "desc": "약속을 따르는 것은 '지키다'예요. 소리는 [지켜]로 나지만 쓸 때는 원래 모양대로 써요." },
  { "q": "책을 가방에 ____ 넣었다.", "opts": ["깊숙이", "깊숙히"], "a": "깊숙이", "desc": "'깊숙하다'지만 부사로 쓸 때는 '깊숙이'가 맞춤법에 맞아요." },
  { "q": "가을 하늘이 참 ____.", "opts": ["파랗다", "파랐다"], "a": "파랗다", "desc": "색깔을 나타내는 '파랗다'는 받침에 'ㅎ'이 있어요." },
  { "q": "나는 커서 훌륭한 ____이 될 거야.", "opts": ["어른", "얼은"], "a": "어른", "desc": "다 자란 사람은 '어른'이에요. '얼은'은 얼음이 얼었을 때 써요." },
  { "q": "____ 친구가 전학을 왔어.", "opts": ["네", "내"], "a": "네", "desc": "너의 친구라는 뜻일 때는 '네'라고 쓰고, 말할 때는 [니]라고 하기도 해요." },
  { "q": "철수가 축구공을 멀리 ____.", "opts": ["찼다", "찾다"], "a": "찼다", "desc": "발로 공을 치는 것은 '차다'라서 '찼다'가 맞아요. 물건을 찾는 건 '찾다'예요." },
  { "q": "무거운 짐은 나누어 ____ 가벼워요.", "opts": ["들어야", "드러야"], "a": "들어야", "desc": "물건을 드는 것이니 '들다'의 모양을 살려서 '들어야'라고 써요." },
  { "q": "나는 네가 정말 ____.", "opts": ["부러워", "부러어"], "a": "부러워", "desc": "'부럽다'는 'ㅂ'이 '우'로 변해서 '부러워'가 돼요." },
  { "q": "바람이 불어서 촛불이 ____.", "opts": ["꺼졌다", "꺼젔다"], "a": "꺼졌다", "desc": "불이 사라지는 것은 '끄다'에 '어'가 붙어서 '꺼지다'가 돼요." },
  { "q": "시험 문제를 잘 읽고 정답을 ____.", "opts": ["맞히다", "맞추다"], "a": "맞히다", "desc": "정답을 골라내는 것은 '맞히다'예요. 친구와 답을 비교해볼 때가 '맞추다'예요." },
  { "q": "____ 떡볶이를 먹으러 가자.", "opts": ["요세", "요새"], "a": "요새", "desc": "'요사이'의 줄임말이라서 '요새'라고 써요." },
  { "q": "집에 가는 길에 문방구에 ____.", "opts": ["들렀다", "들렸다"], "a": "들렀다", "desc": "잠깐 방문하는 것은 '들르다'예요. 그래서 '들렀다'가 맞아요." },
  { "q": "친구랑 싸우지 말고 ____ 지내렴.", "opts": ["사이좋게", "사이조케"], "a": "사이좋게", "desc": "'좋다'의 받침 'ㅎ'을 살려서 '사이좋게'라고 써야 해요." },
  { "q": "글씨를 ____ 써야 선생님이 알아보셔.", "opts": ["바르게", "발으게"], "a": "바르게", "desc": "비뚤어지지 않게 쓰는 것은 '바르다'니까 '바르게'가 맞아요." },
  { "q": "우리 반 당번은 ____ 정하자.", "opts": ["제비뽑기로", "재비뽑기로"], "a": "제비뽑기로", "desc": "새 '제비'처럼 종이를 뽑는 놀이라서 '제비뽑기'라고 해요." },
  { "q": "사과를 예쁘게 ____.", "opts": ["깎아요", "깍아요"], "a": "깎아요", "desc": "껍질을 벗기는 것은 '깎다'예요. 받침 'ㄲ'을 씁니다." },
  { "q": "식사 후에는 이를 ____.", "opts": ["닦아요", "닥아요"], "a": "닦아요", "desc": "걸레나 치솔로 문지르는 것은 '닦다'예요. 받침 'ㄲ'을 씁니다." },
  { "q": "의자에 바르게 ____.", "opts": ["앉아요", "안아요"], "a": "앉아요", "desc": "자리에 '앉다'는 받침 'ㄵ'을 써요. '안아요'는 품에 안을 때 써요." },
  { "q": "도서관에서 책을 ____.", "opts": ["읽어요", "익어요"], "a": "읽어요", "desc": "글자를 보는 것은 '읽다'예요. '익어요'는 과일이 맛있게 익을 때 써요." },
  { "q": "필통에 연필이 ____.", "opts": ["없어요", "업어요"], "a": "없어요", "desc": "가지고 있지 않다는 뜻은 '없다'예요. '업어요'는 아기를 등에 업을 때 써요." },

        const totalQuizCount = 5; // 하루 5문제

        // 3. 초기화: 랜덤으로 5문제 뽑기
        function initGame() {
            // 배열을 무작위로 섞은 뒤 앞에서 5개 자르기
            dailyQuestions = allQuestions.sort(() => 0.5 - Math.random()).slice(0, totalQuizCount);
            renderQuestion();
        }

        // 4. 화면에 문제 그리기
        function renderQuestion() {
            const qData = dailyQuestions[currentIndex];
            
            // 진행바 업데이트
            const progressPercent = ((currentIndex) / totalQuizCount) * 100;
            document.getElementById('progress').style.width = `${progressPercent}%`;

            // 문제 텍스트 (빈칸 포함)
            document.getElementById('question-text').innerHTML = qData.q.replace("____", '<span class="blank"></span>');
            
            // 보기 버튼 생성
            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = ""; // 초기화
            
            // 보기 섞기 (정답 위치 랜덤)
            const shuffledOpts = [...qData.opts].sort(() => 0.5 - Math.random());

            shuffledOpts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                optsContainer.appendChild(btn);
            });

            // 피드백 영역 초기화
            const feedbackEl = document.getElementById('feedback-area');
            feedbackEl.style.display = 'none';
            feedbackEl.className = 'feedback';
            document.getElementById('next-btn').style.display = 'none';
            
            // 버튼 다시 활성화
            const btns = document.querySelectorAll('.options .btn');
            btns.forEach(b => b.disabled = false);
        }

            btns.forEach(b => b.disabled = true);

            if (selected === qData.a) {
                // 정답
                score++;
                feedbackEl.innerHTML = `<strong>🙆‍♂️ 정답입니다!</strong><br>${qData.desc}`;
                feedbackEl.className = 'feedback correct-box';
                btnElement.style.backgroundColor = '#4CAF50'; // 초록색
                btnElement.style.color = 'white';
                btnElement.style.border = '3px solid #4CAF50';
            } else {
                // 오답
                feedbackEl.innerHTML = `<strong>🙅‍♀️ 땡! 틀렸어요.</strong><br>정답은 <strong>'${qData.a}'</strong>입니다.<br><br>💡 ${qData.desc}`;
                feedbackEl.className = 'feedback wrong-box';
                btnElement.style.backgroundColor = '#FF5252'; // 빨간색
                btnElement.style.color = 'white';
                btnElement.style.border = '3px solid #FF5252';
            }

            feedbackEl.style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        // 6. 다음 문제로 이동
        function nextQuestion() {
            currentIndex++;
            if (currentIndex < totalQuizCount) {
                renderQuestion();
            } else {
                showResult();
            }
        }

        // 7. 결과 화면
        function showResult() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            
            document.getElementById('final-score').innerText = `${score} / ${totalQuizCount}`;
            
            const msgEl = document.getElementById('result-message');
            if (score === 5) msgEl.innerText = "와우! 맞춤법 천재가 나타났다! 👑";
            else if (score >= 3) msgEl.innerText = "참 잘했어요! 조금만 더 하면 100점! 💪";
            else msgEl.innerText = "괜찮아요! 매일 연습하면 늘거예요 🌱";
        }

        // 게임 시작
        initGame();
    </script>
</body>
</html>
